<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunity Card - Paraguay</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        .card {
            background-color: #152A4E;
            border: 1px solid #1B3A6B;
            border-radius: 8px;
            overflow: hidden;
            width: 300px;
        }
        .top-bar {
            height: 20px;
            background-color: #D4AF37;
            border-top: 4px solid #D4AF37;
        }
        .content {
            padding: 24px;
            color: white;
        }
        .tags {
            background-color: #1B3A6B;
            color: #C9A84C;
            display: flex;
            flex-wrap: wrap;
            padding: 12px;
            border-radius: 4px;
        }
        .tag {
            margin-right: 8px;
            margin-bottom: 8px;
            padding: 5px;
            border-radius: 4px;
        }
        .flag {
            font-size: 40px;
        }
        .percentage {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="top-bar"></div>
        <div class="content">
            <div class="flag">🇵🇾</div>
            <h2>Paraguay Opportunity Card</h2>
            <p class="percentage">CGT Cripto: 0%</p>
            <p class="percentage">Imposto Renda: 0%</p>
            <p class="percentage">Corporativo: 10%</p>
            <div class="tags">
                <span class="tag">MINERAÇÃO</span>
                <span class="tag">IMÓVEIS</span>
            </div>
        </div>
    </div>
</body>
</html>
